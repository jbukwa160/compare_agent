# ---------------------------------------------------------------------------
# Top products by traffic + EU vendor check.   Run:  python -m top_products
# Shops and their product-page rules live in shops.yaml; matches checked by hand in review.yaml.
# ---------------------------------------------------------------------------

# Every run scrapes all shops in shops.yaml again. DataForSEO answers are kept for the calendar month, so only the
# first run of a month pays (about $6); later runs that month are free and still re-check every product page
# (price, stock). --offline skips DataForSEO and reuses the traffic data already in the Excel.
traffic:
  location_code: 2100          # Bulgaria
  language_code: bg
  leading_per_category: 6      # "leading" = the shops with the most organic Google traffic in their category
  products_per_shop: 20
  pages_leading: 1000          # top pages read per leading shop (each row costs $0.00012)
  pages_other: 300             # top pages read per other shop
  keyword_rows: 100            # keyword rows per shop for its top products
  budget_usd: 10               # the run refuses any paid call that could take it past this

vendors:
  # The company's "EU vendors" folder on the shared Google Drive; every vendor subfolder in it is checked.
  # Read from the first of these that exists:
  #   1. --vendors PATH (the folder, or its .zip download)
  #   2. Google Drive API, when .env has GOOGLE_SERVICE_ACCOUNT_FILE (setup: see top_products/drive.py)
  #   3. the folder as Google Drive for desktop shows it, on any drive letter (G:\Shared drives\...)
  #   4. the newest "EU vendors*.zip" in this folder, in input/ or in Downloads
  drive_path: 'Shared drives/SUPPLIERS & LISTINGS & CATALOGS & CRM/CATALOUGES-VENDORS/EU vendors'
  drive_folder_id: 15qS4Z2w9Z4KC1nLhhz4D7rZxkyouune2
  vat: 0.20                    # vendor prices are without VAT; Bulgarian shop prices include it
  name_match_threshold: 0.85   # 0..1, products without a barcode on the shop page are matched by name
  fx_to_eur: {EUR: 1.0, GBP: 1.17, USD: 0.86}
  barcode_cache_days: 30       # barcodes read from shop pages are reused this long

# How worth it a product is to stock, 1-10 (sheet "EU доставчици").
#   profit = cheapest Bulgarian shop price - cheapest vendor price x (1 + VAT)
#   margin = profit / cheapest Bulgarian shop price;  traffic = monthly Google visits to the shops' pages
# One point for each step reached:
score:
  profit_eur: [3, 10, 25, 50]        # up to 4 points
  margin: [0.10, 0.20, 0.30]         # up to 3 points
  traffic: [100, 1000, 5000]         # up to 3 points
  min_profit_eur: 3                  # less profit per unit than this = 1 (not worth the import work)
  low_margin: 0.10                   # a margin below this caps the score ...
  low_margin_max_score: 3            # ... at this (fees, shipping and returns eat a thin margin)
