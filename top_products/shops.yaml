# ---------------------------------------------------------------------------
# Shops checked for each category. Only used with --traffic.
# The 6 with the most organic Google traffic in a category are "leading" (content_site: true never is).
#
#   domain          the shop's own host, without www.
#   product_rx      regex on the URL path (without ?query) that marks a product page
#   skip_rx         pages never worth opening (blog, multi-level categories)
#   exclude_rx      pages that match product_rx but are not products (promo landing pages)
#   by_page: true   product and category URLs look alike: open the page and judge by its product data
#   keep_crumbs_rx  general shops: only products whose shop category (breadcrumb) matches belong to the category
#   impersonate     open pages as Chrome (shops that block scripts)
#   delay           seconds between pages on this shop (default 1.5)
#   price_css / oos_css / instock_css   price and stock shown only in the page, not in its product data
#   cache_bust      true = add ?v=<date> (a shop whose page cache serves empty copies)
#   pages_target / pages_filters        the DataForSEO report takes no subdomains: ask the domain + a page filter
#   open_rule / open_other / open_by_page   how many pages to open (defaults 45 / 15 / 80)
#   brand_is_shop   the shop writes its own name as every product's brand
#   overrides       {part of a URL: {field: value, note: text}} for single pages
#   scope_note      shown in the summary
# ---------------------------------------------------------------------------

Детски:
  - {name: Jumbo, domain: e-jumbo.bg, aliases: [Джъмбо, e-jumbo], product_rx: '^/bg/(igrachki|stoki-za-bebeta)/.+_\d+/?$',
     impersonate: true, price_css: '.prices-container .current-price', scope_note: само играчки и бебешки стоки}
  - {name: Hippoland, domain: hippoland.net, aliases: [Хиполенд], by_page: true, product_rx: '^/[^/]+$', skip_rx: '^/produkti/|^/[^/]+/.'}
  - {name: Vis Vitalis, domain: visvitalis.bg, aliases: [Вис Виталис], product_rx: '^/product/', delay: 3}
  - {name: Comsed, domain: comsed.net, aliases: [Комсед], by_page: true, skip_rx: '^/[^/]+/.'}
  - {name: Raya Toys, domain: rayatoys.com, aliases: [Рая Тойс, RayaToys], by_page: true, skip_rx: '^/[^/]+/.',
     overrides: {izberi-lesno-svoyata-konfiguratsiya: {price_min: null, price_max: null, note: 'конфигуратор: цената зависи от избраната комбинация'}}}
  - {name: Baby.bg, domain: baby.bg, product_rx: '^/product/'}
  - {name: BG Hlapeta, domain: bghlapeta.com, aliases: [БГ Хлапета], by_page: true, skip_rx: '^/cats/|^/[^/]+/.'}
  - {name: LEGO Bravo Store, domain: lego.bravostore.bg, product_rx: '^/products/', pages_target: bravostore.bg,
     pages_filters: [[page_address, regex, 'lego\.bravostore\.bg/']]}
  - {name: Patilanci, domain: patilanci.bg, aliases: [Патиланци], product_rx: '^/pat\d+-'}
  - {name: Kosara, domain: kosara.bg, aliases: [Косара], product_rx: '^/\d+/'}
  - {name: Doniceta, domain: doniceta.com, product_rx: '^/product/\d+/'}
  - {name: Crazy Kids, domain: crazy-kids.bg, by_page: true, skip_rx: '^/[^/]+/.'}
  - {name: K&K, domain: k-k.bg, by_page: true, skip_rx: '^/[^/]+/.'}
  - {name: Kinderland, domain: kinderland.bg, by_page: true}
  - {name: Okaidi, domain: okaidi.bg, by_page: true}
  - {name: Teddy Toys, domain: teddytoys.bg, by_page: true}
  - {name: Toyzz Shop, domain: toyzzshop.bg, by_page: true, skip_rx: '^/[^/]+/.', impersonate: true}
  - {name: Toy Store, domain: toy.store.bg, by_page: true, pages_target: store.bg, pages_filters: [[page_address, regex, 'toy\.store\.bg/']]}

