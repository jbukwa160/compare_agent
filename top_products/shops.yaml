     keep_crumbs_rx: '^(Гейминг|Аудио и hi-fi|Смартфони и смарт устройства|Малки електроуреди|Големи електроуреди|Тв, фото и видео|Лаптопи, компютри и монитори|Компютърни компоненти|Компютри и периферия|Умен дом)',
     price_css: '#product_addtocart_form .price-box .special-price .price, #product_addtocart_form .price-box .regular-price .price',
     oos_css: '#product_addtocart_form .availability.out-of-stock', instock_css: '#product_addtocart_form .availability.in-stock'}
