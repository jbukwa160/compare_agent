     keep_crumbs_rx: '^(Мобилни телефони|Таблети|Лаптопи|Компютри|Монитори|Периферия|PC компоненти|Мрежов|Принтери|Gaming|Гейминг|Конзоли|Видео игри|Телевизори|Видео проектори|Системи за домашно кино|Аудио|Слушалки|Фотоапарати|Електроника|Джаджи & Smart|Smart|Смарт|Носими|Уреди & Аксесоари за лична грижа|[KК]ухненски уреди|Малки електроуреди|Големи електроуреди|Климатици|Прахосмукачки|Електрически превозни средства|Хладилници|Перални)'}
  - {name: Ozone, domain: ozone.bg, aliases: [Озон, Ozone.bg], product_rx: '^/product/[^/]+/?$', open_rule: 150,
